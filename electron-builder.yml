appId: com.worshipflow.app
productName: WorshipFlow
copyright: Copyright © 2026 WorshipFlow

files:
  - dist/**/*
  - electron/**/*
  - assets/**/*

asar: true
compression: maximum

win:
  target: nsis
  icon: assets/icons/icon.ico

nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true

mac:
  target: dmg
  icon: assets/icons/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  window:
    width: 540
    height: 380
  contents:
    - { x: 150, y: 180, type: file }
    - { x: 390, y: 180, type: link, path: /Applications }
